spring.application.name=notification-service
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/notifications}
spring.datasource.username=${DB_USER:notifications}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=500
spring.datasource.hikari.validation-timeout=250
spring.datasource.hikari.data-source-properties.connectTimeout=1
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.sql.init.mode=always
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
notify.clients.business=${NOTIFY_API_KEY:}
notify.allowed-origins=${NOTIFY_ALLOWED_ORIGINS:}
notify.worker-enabled=${NOTIFY_WORKER_ENABLED:true}
notify.poll-millis=1000
notify.concurrency=4
notify.max-attempts=20
notify.max-age=24h
notify.request-timeout=10s
notify.api-timeout=5s
notify.lease-duration=30s
notify.backoff-base=30s
notify.backoff-cap=1h
